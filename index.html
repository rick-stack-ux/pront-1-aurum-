<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Aurumsys | Vision</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --bg-app: #080808; 
  --bg-card: #121212; 
  --bg-card-hover: #1a1a1a;
  --accent: #FFEA00; 
  --accent-glow: rgba(255, 234, 0, 0.2);
  --text-main: #ffffff;
  --text-muted: #888888;
  --danger: #ef4444;
  --success: #10b981;
  --border: rgba(255, 255, 255, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg-app);
  color: var(--text-main);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  padding: 20px;
  background-image: 
    radial-gradient(circle at 15% 50%, rgba(255, 234, 0, 0.03), transparent 25%),
    radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.02), transparent 25%);
}

/* ================= HEADER ================= */
header {
  display: flex;
  justify-content: center; /* Centra el contenido y quita el espacio extenso */
  align-items: center;
  margin-bottom: 30px;
  padding: 12px 30px;
  background: rgba(18, 18, 18, 0.8);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: 0 4px 30px rgba(0,0,0,0.8);
  width: max-content;
  margin-left: auto;
  margin-right: auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 15px;
}

.brand img.logo {
  width: 55px;
  height: 55px;
  object-fit: cover;
  border-radius: 50%;
  clip-path: circle(43% at 50% 50%); 
  border: 2px solid var(--accent); 
  box-shadow: 0 0 10px var(--accent-glow);
}

.brand h1 {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.brand h1 span {
  font-weight: 300;
  color: var(--text-muted);
}

/* ================= GRID & CARDS ================= */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 25px;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  position: relative;
  overflow: hidden;
}

.card:hover {
  background: var(--bg-card-hover);
  box-shadow: 0 12px 45px rgba(0,0,0,0.8);
  border-color: rgba(255, 234, 0, 0.2);
}

.card.disabled {
  opacity: 0.6;
  filter: grayscale(0.8);
}

/* ================= CARD HEADER ================= */
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-title {
  font-size: 1.2rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}

.telemetry-badges {
  display: flex;
  gap: 8px;
}

.badge {
  background: #000;
  border: 1px solid var(--border);
  padding: 4px 8px;
  border-radius: 8px;
  font-size: 0.75rem;
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--text-muted);
}
.badge.battery { color: #10b981; }
.badge.wifi { cursor: pointer; transition: 0.2s; }
.badge.wifi:hover { color: var(--text-main); background: rgba(255,255,255,0.1); }

/* ===== SWITCH ===== */
.switch-container { display: flex; align-items: center; }
.switch { position: relative; display: inline-block; width: 44px; height: 24px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: rgba(255,255,255,0.1);
  transition: .4s;
  border-radius: 24px;
  border: 1px solid var(--border);
}
.slider:before {
  position: absolute;
  content: "";
  height: 16px; width: 16px;
  left: 3px; bottom: 3px;
  background-color: var(--text-muted);
  transition: .4s;
  border-radius: 50%;
}
input:checked + .slider {
  background-color: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow);
}
input:checked + .slider:before {
  transform: translateX(20px);
  background-color: #000;
}

/* ================= VISOR DE IMAGEN ================= */
.preview-container {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid rgba(255, 234, 0, 0.15);
  box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
  display: flex;
  justify-content: center;
  align-items: center;
}

.preview-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.no-signal {
  color: var(--text-muted);
  font-size: 0.9rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.no-signal i { font-size: 2rem; opacity: 0.5; }

.overlay-top, .overlay-bottom {
  position: absolute;
  left: 0;
  width: 100%;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
  pointer-events: none;
}
.overlay-bottom {
  top: auto;
  bottom: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
}

.location-tag {
  font-size: 0.75rem;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(0,0,0,0.6);
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  backdrop-filter: blur(4px);
}

.time-tag {
  font-family: 'Courier New', monospace;
  font-size: 0.8rem;
  color: var(--accent);
  font-weight: bold;
}

/* ================= CONTROLES ================= */
.action-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  color: var(--text-main);
  padding: 12px;
  border-radius: 10px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  transition: all 0.2s ease;
}

.btn:hover:not(:disabled) {
  background: rgba(255, 234, 0, 0.1);
  border-color: var(--accent);
  color: var(--accent);
}

.btn.primary {
  background: var(--accent);
  color: #000;
  border: none;
}
.btn.primary:hover:not(:disabled) {
  background: #ffea00;
  box-shadow: 0 0 15px var(--accent-glow);
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* ================= AJUSTES AVANZADOS ================= */
.settings-panel {
  display: none;
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  grid-template-columns: 1fr;
  gap: 12px;
}
.settings-panel.active { display: grid; }

.setting-row { display: flex; flex-direction: column; gap: 6px; }
.setting-row label {
  font-size: 0.75rem;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
}

input[type=range] {
  -webkit-appearance: none;
  width: 100%;
  background: transparent;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  height: 16px;
  width: 16px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  margin-top: -6px;
}
input[type=range]::-webkit-slider-runnable-track {
  width: 100%;
  height: 4px;
  cursor: pointer;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
}

.sync-status {
  text-align: center;
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 5px;
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <img src="image_ec08dd.png" class="logo" alt="Logo Aurum">
    <h1>Aurumsys <span>| VISION</span></h1>
  </div>
</header>

<section class="grid" id="grid"></section>

<script>
/* ================= CONFIG ================= */
const TOTAL_TRAPS = 3;
const CAMERA_LIVE_DURATION = 20000;

const MAIN_ESP_BASE = "http://10.153.210.142";
const STREAM_URL = MAIN_ESP_BASE + "/stream";
const FIREBASE_DB = "https://t-sonda-2-default-rtdb.firebaseio.com";

/* ================= UTIL ================= */
function nowString(){
  const d = new Date();
  return d.toISOString().replace("T"," ").substring(0,19);
}

function rssiToBars(rssi){
  if(rssi > -60) return '<i class="fa-solid fa-wifi"></i> 100%';
  if(rssi > -70) return '<i class="fa-solid fa-wifi"></i> 70%';
  if(rssi > -80) return '<i class="fa-solid fa-wifi" style="opacity:0.6"></i> 40%';
  return '<i class="fa-solid fa-wifi" style="opacity:0.3; color:var(--danger)"></i> 10%';
}

/* ================= TOGGLE ================= */
function moduleKey(id){ return `aurum_module_${id}`; }
function isEnabled(id){
  const v = localStorage.getItem(moduleKey(id));
  return v === null ? true : v === "true";
}
function setEnabled(id,val){ localStorage.setItem(moduleKey(id), val); }

/* ================= FIREBASE ================= */
async function getTrapState(id){
  const res = await fetch(`${FIREBASE_DB}/traps/${id}.json`).catch(()=>null);
  return res ? await res.json() : null;
}
function sendCommand(id, cmd){
  fetch(`${FIREBASE_DB}/traps/${id}/command.json`, {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(cmd)
  }).catch(e=>console.log("Error", e));
}

/* ================= FILTROS ================= */
function applyFilters(previewImg, z, b, c){
  if(!previewImg) return;
  previewImg.style.transform = `scale(${z})`;
  previewImg.style.filter = `brightness(${b}) contrast(${c})`;
}

/* ================= STREAM ================= */
async function openLiveCamera(id, container, previewImg, btn){
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Conectando...';
  btn.disabled = true;

  setTimeout(() => {
    previewImg.style.display = 'block';
    previewImg.src = `${STREAM_URL}?t=${Date.now()}`;
    
    const noSig = container.querySelector('.no-signal');
    if(noSig) noSig.style.display = 'none';

    btn.innerHTML = '<i class="fa-solid fa-video"></i> Transmitiendo';
    btn.classList.add('primary');

    setTimeout(()=>{
      btn.innerHTML = '<i class="fa-solid fa-satellite-dish"></i> Cámara en vivo';
      btn.classList.remove('primary');
      btn.disabled = false;
    }, CAMERA_LIVE_DURATION);
  }, 1000);
}

/* ================= RENDER ================= */
const grid = document.getElementById("grid");
const mockLocations = ["Sector Alfa - Lat: -33.8", "Sector Beta - Lat: -33.9", "Sector Gamma - Lat: -34.0"];

for(let i=1; i<=TOTAL_TRAPS; i++){
  const card = document.createElement("div");
  card.className = "card";
  const isEn = isEnabled(i);
  const mockBattery = Math.floor(Math.random() * 60) + 40;
  const loc = mockLocations[i-1];

  card.innerHTML = `
    <div class="card-header">
      <div class="card-title">
        <i class="fa-solid fa-microchip"></i> Trampa ${i}
      </div>
      <div class="telemetry-badges">
        <span class="badge battery" id="batt${i}"><i class="fa-solid fa-battery-full"></i> ${mockBattery}%</span>
        <span class="badge wifi" id="wifi${i}" title="Ver red actual"><i class="fa-solid fa-wifi"></i> --</span>
        <div class="switch-container">
          <label class="switch">
            <input type="checkbox" id="toggle${i}" ${isEn ? 'checked' : ''}>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="preview-container" id="container${i}">
      <div class="overlay-top">
        <div class="location-tag"><i class="fa-solid fa-location-crosshairs"></i> ${loc}</div>
      </div>
      <div class="no-signal" id="nosig${i}">
        <i class="fa-regular fa-image"></i>
        <span>Esperando conexión...</span>
      </div>
      <img src="" id="img${i}" style="display:none;" alt="Cámara">
      <div class="overlay-bottom">
        <div class="time-tag" id="time${i}">${nowString()}</div>
      </div>
    </div>

    <div class="action-grid">
      <button class="btn" id="cam${i}"><i class="fa-solid fa-satellite-dish"></i> Cámara en vivo</button>
      <button class="btn" id="set${i}"><i class="fa-solid fa-sliders"></i> Calibración</button>
    </div>

    <div class="settings-panel" id="settings${i}">
      <div class="setting-row">
        <label><span>Zoom Digital</span> <span id="z-val${i}">1.0x</span></label>
        <input type="range" id="z${i}" min="1" max="3" step="0.1" value="1">
      </div>
      <div class="setting-row">
        <label><span>Brillo IR</span> <span id="b-val${i}">100%</span></label>
        <input type="range" id="b${i}" min="0.5" max="2" step="0.1" value="1">
      </div>
      <div class="setting-row">
        <label><span>Contraste</span> <span id="c-val${i}">100%</span></label>
        <input type="range" id="c${i}" min="0.5" max="2" step="0.1" value="1">
      </div>
    </div>
    <div class="sync-status"><i class="fa-solid fa-cloud-arrow-up"></i> Sincronizado: ${nowString().split(' ')[1]}</div>
  `;

  grid.appendChild(card);

  const toggle = card.querySelector(`#toggle${i}`);
  const camBtn = card.querySelector(`#cam${i}`);
  const setBtn = card.querySelector(`#set${i}`);
  const container = card.querySelector(`#container${i}`);
  const img = card.querySelector(`#img${i}`);
  const settings = card.querySelector(`#settings${i}`);
  const timeLabel = card.querySelector(`#time${i}`);
  const wifiBtn = card.querySelector(`#wifi${i}`);
  const zIn = card.querySelector(`#z${i}`), bIn = card.querySelector(`#b${i}`), cIn = card.querySelector(`#c${i}`);
  const zVal = card.querySelector(`#z-val${i}`), bVal = card.querySelector(`#b-val${i}`), cVal = card.querySelector(`#c-val${i}`);

  // Evento para mostrar la red al hacer clic en WiFi
  wifiBtn.onclick = async () => {
    try {
      const state = await getTrapState(i);
      const ssid = (state && state.ssid) ? state.ssid : "Aurumsys_Net (Red Local)";
      alert(`Trampa ${i} conectada a la red:\n${ssid}`);
    } catch(e) {
      alert(`Trampa ${i}\nEstado de red no disponible.`);
    }
  };

  setInterval(() => { timeLabel.textContent = nowString(); }, 1000);

  function applyState(){
    const en = toggle.checked;
    setEnabled(i, en);
    card.classList.toggle("disabled", !en);
    camBtn.disabled = !en || i !== 1;
  }

  toggle.addEventListener('change', () => {
    applyState();
    sendCommand(i, toggle.checked ? "ENABLE" : "DISABLE");
  });

  camBtn.onclick = () => openLiveCamera(i, container, img, camBtn);
  setBtn.onclick = () => settings.classList.toggle("active");

  const updateFilters = () => {
    applyFilters(img, zIn.value, bIn.value, cIn.value);
    zVal.textContent = `${zIn.value}x`;
    bVal.textContent = `${Math.round(bIn.value * 100)}%`;
    cVal.textContent = `${Math.round(cIn.value * 100)}%`;
  };

  zIn.oninput = updateFilters; bIn.oninput = updateFilters; cIn.oninput = updateFilters;
  applyState();
}

window.onload = async () => {
  for(let i=1; i<=TOTAL_TRAPS; i++){
    const wifiBadge = document.getElementById(`wifi${i}`);
    const img = document.getElementById(`img${i}`);
    const noSig = document.getElementById(`nosig${i}`);

    try {
      const state = await getTrapState(i);
      if(state) {
        wifiBadge.innerHTML = rssiToBars(state.wifi || -90);
        if(state.lastCapture === "OK" && state.lastImage){
          img.src = state.lastImage;
          img.style.display = 'block';
          noSig.style.display = 'none';
        }
      }
    } catch(e) {}
  }
};
</script>
</body>
</html>
