<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Aurumsys | Vision</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root[data-theme="dark"] {
  --bg-app: #080808; 
  --bg-card: #121212; 
  --bg-card-hover: #1a1a1a;
  --accent: #FFEA00; 
  --accent-glow: rgba(255, 234, 0, 0.2);
  --text-main: #ffffff;
  --text-muted: #888888;
  --danger: #ef4444;
  --success: #10b981;
  --border: rgba(255, 255, 255, 0.08);
  --panel-bg: rgba(18, 18, 18, 0.95);
}

:root[data-theme="light"] {
  --bg-app: #f4f4f6; 
  --bg-card: #ffffff; 
  --bg-card-hover: #fcfcfc;
  --accent: #d4b800; 
  --accent-glow: rgba(212, 184, 0, 0.2);
  --text-main: #1a1a1a;
  --text-muted: #666666;
  --danger: #dc2626;
  --success: #059669;
  --border: rgba(0, 0, 0, 0.1);
  --panel-bg: rgba(255, 255, 255, 0.95);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg-app);
  color: var(--text-main);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  padding: 20px;
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

/* ================= HEADER ================= */
header {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 30px;
  padding: 12px 30px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: 0 4px 30px rgba(0,0,0,0.1);
  width: max-content;
  max-width: 100%;
  margin-left: auto;
  margin-right: auto;
  position: relative;
}

.brand {
  display: flex;
  align-items: center;
  gap: 15px;
}

.brand img.logo {
  width: 55px;
  height: 55px;
  object-fit: cover;
  clip-path: circle(38% at 50% 50%); 
}

.brand h1 {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.brand h1 span {
  font-weight: 300;
  color: var(--text-muted);
}

/* Botón de Engranaje Global */
.global-settings-btn {
  position: fixed;
  top: 25px;
  right: 25px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-main);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 1.2rem;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  transition: all 0.2s;
  z-index: 1000;
}
.global-settings-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: rotate(45deg);
}

/* ================= GRID & CARDS ================= */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 25px;
  max-width: 1300px;
  margin: 0 auto;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  position: relative;
  overflow: hidden;
  transition: background 0.3s, border 0.3s;
}

.card.disabled {
  opacity: 0.5;
  filter: grayscale(0.8);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-title {
  font-size: 1.1rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}

.telemetry-badges {
  display: flex;
  gap: 8px;
  align-items: center;
}

.badge {
  background: var(--bg-app);
  border: 1px solid var(--border);
  padding: 4px 8px;
  border-radius: 8px;
  font-size: 0.75rem;
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--text-muted);
}
.badge.battery { color: var(--success); }
.badge.wifi { cursor: pointer; transition: 0.2s; }
.badge.wifi:hover { color: var(--text-main); border-color: var(--accent); }

/* SWITCH */
.switch { position: relative; display: inline-block; width: 42px; height: 22px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: var(--border);
  transition: .3s; border-radius: 22px;
}
.slider:before {
  position: absolute; content: "";
  height: 16px; width: 16px;
  left: 3px; bottom: 3px;
  background-color: var(--text-muted);
  transition: .3s; border-radius: 50%;
}
input:checked + .slider { background-color: var(--accent); }
input:checked + .slider:before { transform: translateX(20px); background-color: #000; }

/* PREVIEW CAM */
.preview-container {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  display: flex;
  justify-content: center;
  align-items: center;
}
.preview-container img { width: 100%; height: 100%; object-fit: cover; }
.no-signal {
  color: var(--text-muted);
  font-size: 0.85rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.overlay-top, .overlay-bottom {
  position: absolute; left: 0; width: 100%; padding: 8px;
  display: flex; justify-content: space-between; align-items: center;
  background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
  pointer-events: none;
}
.overlay-bottom { top: auto; bottom: 0; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); }
.location-tag {
  font-size: 0.7rem; color: #fff; background: rgba(0,0,0,0.5);
  padding: 3px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1);
}
.time-tag { font-family: monospace; font-size: 0.75rem; color: var(--accent); }

/* BOTONERA */
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn {
  background: var(--bg-app);
  border: 1px solid var(--border);
  color: var(--text-main);
  padding: 10px;
  border-radius: 8px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  display: flex; justify-content: center; align-items: center; gap: 6px;
  transition: 0.2s;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: #000; border: none; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ================= SUB-MENÚ FLOTANTE CENTRADO EN TARJETA ================= */
.sub-panel {
  display: none;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 90%;
  max-width: 320px;
  background: var(--panel-bg);
  border: 1px solid var(--accent);
  border-radius: 14px;
  padding: 16px;
  flex-direction: column;
  gap: 12px;
  backdrop-filter: blur(10px);
  box-shadow: 0 15px 40px rgba(0,0,0,0.6);
  z-index: 50;
  animation: popIn 0.2s ease-out;
}
.sub-panel.active { display: flex; }

.sub-panel-header {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.9rem; font-weight: 600; color: var(--accent);
  border-bottom: 1px solid var(--border); padding-bottom: 8px;
}
.sub-panel-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; }
.sub-panel-close:hover { color: var(--text-main); }
.sub-panel-content { font-size: 0.8rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 6px; }

/* ================= MODAL GLOBAL DE CONFIGURACIÓN ================= */
.modal-overlay {
  display: none;
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
  justify-content: center; align-items: center; z-index: 2000;
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  width: 90%; max-width: 450px;
  border-radius: 20px; padding: 25px;
  display: flex; flex-direction: column; gap: 18px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.8);
  animation: popIn 0.3s ease-out;
}
.modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; font-weight: 700; color: var(--accent); }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
.form-control {
  background: var(--bg-app); border: 1px solid var(--border);
  color: var(--text-main); padding: 10px 12px; border-radius: 8px; font-size: 0.9rem;
}
.form-control:focus { outline: none; border-color: var(--accent); }

@keyframes popIn {
  from { opacity: 0; transform: translate(-50%, -48%) scale(0.95); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}
</style>
</head>
<body onclick="handleGlobalClick(event)">

let currentLang = localStorage.getItem('aurum_lang') || 'es';
let currentTheme = localStorage.getItem('aurum_theme') || 'dark';

document.documentElement.setAttribute('data-theme', currentTheme);
document.getElementById('themeSelect').value = currentTheme;
document.getElementById('langSelect').value = currentLang;

function t(key){ return dict[currentLang][key] || dict['es'][key]; }

function updateTexts(){
  document.getElementById('txt-modal-title').innerHTML = `<i class="fa-solid fa-sliders"></i> ${t('settingsTitle')}`;
  document.getElementById('txt-lang-label').textContent = t('langLabel');
  document.getElementById('txt-theme-label').textContent = t('themeLabel');
  document.getElementById('txt-apikey-label').textContent = t('apiKeyLabel');
  document.getElementById('txt-whatsapp-label').textContent = t('waLabel');
  document.getElementById('txt-save-btn').innerHTML = `<i class="fa-solid fa-floppy-disk"></i> ${t('saveBtn')}`;

  for(let i=1; i<=3; i++){
    const card = document.getElementById(`card${i}`);
    if(!card) continue;
    card.querySelector('.card-title').innerHTML = `<i class="fa-solid fa-microchip"></i> ${t('trap')} ${i}`;
    card.querySelector(`#cam-txt${i}`).textContent = t('liveCam');
    card.querySelector(`#set-txt${i}`).textContent = t('calibration');
    card.querySelector(`#save-txt${i}`).textContent = t('saveCap');
    card.querySelector(`#loc-txt${i}`).textContent = t('location');
    card.querySelector(`#nosig-txt${i}`).textContent = t('waiting');
  }
}

function changeLanguage(lang){
  currentLang = lang;
  localStorage.setItem('aurum_lang', lang);
  updateTexts();
}

function changeTheme(theme){
  currentTheme = theme;
  localStorage.setItem('aurum_theme', theme);
  document.documentElement.setAttribute('data-theme', theme);
}

function toggleSettingsModal(e){
  e.stopPropagation();
  document.getElementById('settingsModal').classList.toggle('active');
}
function closeSettingsModal(){
  document.getElementById('settingsModal').classList.remove('active');
}
function saveGlobalSettings(){
  alert("¡Configuración guardada con éxito!");
  closeSettingsModal();
}

/* ================= CIERRE GLOBAL AL CLIC ================= */
function handleGlobalClick(e){
  // Cierra todos los sub-paneles internos de las tarjetas si se hace clic fuera de ellos
  document.querySelectorAll('.sub-panel').forEach(p => p.classList.remove('active'));
}

      <div class="sub-panel-header">
        <span><i class="fa-solid fa-camera"></i> ${t('manager')}</span>
        <button class="sub-panel-close" onclick="closePanels()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="sub-panel-content">
        <strong>${t('savedOk')}</strong>
        <p>${t('savedDesc')}</p>
      </div>
    </div>

    <!-- SUB-PANEL UBICACIÓN -->
    <div class="sub-panel" id="loc-panel${i}" onclick="event.stopPropagation()">
      <div class="sub-panel-header">
        <span><i class="fa-solid fa-map-location-dot"></i> ${t('coords')}</span>
        <button class="sub-panel-close" onclick="closePanels()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="sub-panel-content">
        <strong>${loc}</strong>
        <p>${t('connected')}</p>
      </div>
    </div>
  `;
  grid.appendChild(card);
}

function closePanels(){
  document.querySelectorAll('.sub-panel').forEach(p => p.classList.remove('active'));
}

function toggleSubPanel(e, panelId){
  e.stopPropagation();
  const panel = document.getElementById(panelId);
  const isActive = panel.classList.contains('active');
  closePanels();
  if(!isActive) panel.classList.add('active');
}

function openLive(id){
  const img = document.getElementById(`img${id}`);
  const nosig = document.getElementById(`nosig${id}`);
  img.src = "https://picsum.photos/600/340?random=" + id;
  img.style.display = 'block';
  nosig.style.display = 'none';
}
</script>
</body>
</html>
